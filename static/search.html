<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Buttons</title>
    <link rel="stylesheet" href="style.css">
    <script>
        async function init() {
            // "<flags>,<query>", and the query itself may contain commas
            let hash = decodeURIComponent(window.location.hash.substring(1));
            let comma = hash.indexOf(",");
            let searches = hash.substring(0, comma);
            let query = hash.substring(comma + 1);
            let res = await fetch("/api/search?query=" + encodeURIComponent(query) + "&search_in=" + searches);
            let resJson = JSON.parse(await res.text());
            if (res.status !== 200) {
                document.body.innerText = "Search failed: " + resJson["error"];
                return;
            }
            let results = resJson["results"];
            let buttons = document.getElementById("buttons");
            for (let hash of results) {
                let a = document.createElement("a");
                a.href = "/button#" + hash;
                let img = document.createElement("img");
                img.src = "/api/button/" + hash + "/img";
                img.alt = "Button with hash " + hash;
                img.className = "button";
                a.innerHTML = img.outerHTML;
                buttons.appendChild(a);
            }
        }

        window.onload = init;
    </script>
</head>
<body>
<small><a href="/">home</a></small>
<br>
<h1>Search results</h1>
<div class="buttons" id="buttons"></div>
</body>
</html>
